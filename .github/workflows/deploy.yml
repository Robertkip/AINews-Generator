name: Deploy AI news landing page

# site/ is built and committed by weekly_ai_agent.py (runs locally via cron);
# this workflow only publishes it, so it must not rebuild or overwrite it.
on:
  workflow_dispatch:       # run manually from the Actions tab
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
